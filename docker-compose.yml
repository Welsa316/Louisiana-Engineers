name: mest

services:
  postgres:
    image: postgres:16
    ports:
      - "54329:5432"
    environment:
      POSTGRES_USER: mest
      POSTGRES_PASSWORD: mest
      POSTGRES_DB: mest
    volumes:
      - mest-postgres:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mest -d mest"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mest-postgres: {}
